name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Lockfile gate (intentional block until resolution is committed)
        run: node scripts/check-lockfile.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm audit --audit-level=high
      - name: Generate Linux deployment SBOM
        run: pnpm sbom:generate:runtime
      - name: Audit declared licenses (ADR-015 precheck)
        env:
          GENESIS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/audit-sbom-licenses.mjs test-results/hsp4-runtime-linux-x64.sbom.spdx.json test-results/hsp4-license-declarations.json
      - name: Inventory bytes and notices of non-preferred installed packages
        run: node scripts/inventory-license-files.mjs test-results/hsp4-license-declarations.json test-results/hsp4-license-files.json test-results/hsp4-license-texts
      - name: Classify production dependency reachability
        shell: bash
        run: |
          pnpm list --prod --depth Infinity --json > test-results/hsp4-production-dependency-tree.json
          node scripts/classify-license-dependencies.mjs test-results/hsp4-license-declarations.json test-results/hsp4-production-dependency-tree.json test-results/hsp4-license-production-classification.json
          echo 'HSP-4 license gate: **BLOCKED** pending deployed-artifact inventory and owner/legal disposition. A green CI check is only a declaration precheck.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hsp4-runtime-linux-x64-sbom
          path: |
            test-results/hsp4-runtime-linux-x64.sbom.spdx.json
            test-results/hsp4-license-declarations.json
            test-results/hsp4-license-files.json
            test-results/hsp4-license-texts/
            test-results/hsp4-production-dependency-tree.json
            test-results/hsp4-license-production-classification.json
          if-no-files-found: error
          retention-days: 30
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Apply migrations and local seed
        run: supabase db reset --local
      - name: Execute all pgTAP tests (not a static substitute)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          supabase test db 2>&1 | tee test-results/database.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: database-evidence
          path: test-results/database.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
