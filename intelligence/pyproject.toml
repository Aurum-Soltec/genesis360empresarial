[project]
name = "genesis-intelligence-spike"
version = "0.1.0"
description = "Isolated Genesis 360 agentic runtime spike. Not a production dependency yet."
requires-python = ">=3.10"
dependencies = [
  "pydantic-ai-slim==2.33.0",
]

[project.optional-dependencies]
openai = [
  "pydantic-ai-slim[openai]==2.33.0",
]
evals = [
  "pydantic-ai-slim[evals]==2.33.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
